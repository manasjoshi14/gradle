gradle.lifecycle.beforeProject { project ->
    if (project.path == ':performance') {
        project.tasks.configureEach { task ->
            if (task.name == 'largeMonolithicJavaProject') {
                task.inputs.property('normalizedCacheSourceFiles',
                    project.providers.environmentVariable('NORMALIZED_CACHE_SOURCE_FILES').orElse('50000'))
            }
        }
    }
}
