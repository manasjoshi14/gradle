name: Normalized source cache experiment

on:
  workflow_dispatch:
    inputs:
      files:
        description: Source files per serial case
        type: choice
        options: ['1000', '5000', '10000', '50000']
        default: '1000'
      runs:
        description: Measured pairs per case
        type: choice
        options: ['5', '7', '10']
        default: '5'
      warmups:
        description: Warmup pairs per case
        type: choice
        options: ['1', '2', '3']
        default: '1'
      scenarios:
        description: Fresh plus raw control, or all six cases
        type: choice
        options: ['fresh', 'all']
        default: 'all'
      sessions:
        description: Independent runner sessions
        type: choice
        options: ['1', '3']
        default: '1'

permissions:
  contents: read

concurrency:
  group: normalized-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    if: github.repository == 'manasjoshi14/gradle' && !github.event.repository.private
    name: Experiment session ${{ matrix.session }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        session: ${{ fromJSON(inputs.sessions == '3' && '[1,2,3]' || '[1]') }}
    env:
      EXPERIMENT_SESSION: ${{ matrix.session }}
    steps:
      - name: Check out experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set experiment directories
        run: |
          echo "EXPERIMENT_ROOT=$RUNNER_TEMP/normalized-cache-experiment" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/source-gradle-home" >> "$GITHUB_ENV"
      - name: Load pinned baseline commit
        run: git fetch --no-tags --depth=1 https://github.com/manasjoshi14/gradle.git e04ee63317eeb36ac5102b6a3aa7e6cd931850a2
      - name: Set up fixed JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25.0.3+9'
      - name: Record runner capacity
        run: |
          df -h
          lscpu
          free -h
          java -version
      - name: Build both runtimes and verify correctness
        run: python3 .github/experiments/normalized-source-cache/ci.py build
      - name: Run paired comparisons
        env:
          EXPERIMENT_FILES: ${{ inputs.files }}
          EXPERIMENT_RUNS: ${{ inputs.runs }}
          EXPERIMENT_WARMUPS: ${{ inputs.warmups }}
          EXPERIMENT_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          python3 .github/experiments/normalized-source-cache/ci.py benchmark \
            --files "$EXPERIMENT_FILES" \
            --runs "$EXPERIMENT_RUNS" \
            --warmups "$EXPERIMENT_WARMUPS" \
            --scenario "$EXPERIMENT_SCENARIOS"
      - name: Export checksummed evidence into job log
        if: always()
        run: python3 .github/experiments/normalized-source-cache/ci.py export
